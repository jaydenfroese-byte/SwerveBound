<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Swervebound: the white player car racing down the road">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a5264"/><stop offset=".5" stop-color="#103b50"/><stop offset="1" stop-color="#07182b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#3f6670"/><stop offset=".72" stop-color="#254b5b"/><stop offset="1" stop-color="#123044"/>
    </linearGradient>
    <linearGradient id="whitePaint" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".65" stop-color="#f4ffff"/><stop offset="1" stop-color="#b9d1d8"/>
    </linearGradient>
    <linearGradient id="rearGlass" x1=".15" y1="0" x2=".8" y2="1">
      <stop stop-color="#255b71"/><stop offset=".58" stop-color="#143e55"/><stop offset="1" stop-color="#0b2e43"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff791"/><stop offset="1" stop-color="#ffbd36"/>
    </linearGradient>
    <radialGradient id="underGlow">
      <stop stop-color="#39ffe3" stop-opacity=".62"/><stop offset="1" stop-color="#2affdf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rounded"><rect width="512" height="512" rx="110"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="url(#night)"/>
    <path d="M-93 417 391-89 607 51 84 604-89 566Z" fill="url(#road)"/>
    <path d="M-17 491 474-26" stroke="#f8d259" stroke-width="11" opacity=".85"/>
    <path d="M3 518 494-1" stroke="#fae48c" stroke-width="4" opacity=".58"/>
    <path d="M93 567 595 39" stroke="#63aeb6" stroke-width="13" opacity=".48"/>
    <path d="M-45 364 280 14" stroke="#76cdd3" stroke-width="5" opacity=".3"/>
    <path d="M365 533 542 344" stroke="#51e5e1" stroke-width="8" opacity=".25"/>
    <path d="m46 411 97-16m-73 43 103-19m-51 42 100-27" stroke="#67fff0" stroke-width="12" stroke-linecap="square" opacity=".72"/>
    <ellipse cx="268" cy="343" rx="186" ry="91" transform="rotate(-19 268 343)" fill="url(#underGlow)"/>

    <!-- Receding three-quarter angle of the actual in-game white car:
         squared body, steep tinted rear glass, short trunk, black tire
         volumes, red tail lamps and the pale aqua license plate. -->
    <g transform="rotate(14 262 280)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M136 354 174 406 359 400 392 356 363 330 167 331Z" fill="#071c2c" opacity=".63"/>

      <!-- Chunky tires, placed behind the body just like drawCar(). -->
      <path d="M140 268h34v107h-32l-16-24v-61Z" fill="#142c37" stroke="#082334" stroke-width="6"/>
      <path d="M345 262h34l10 34v60l-16 22h-28Z" fill="#142c37" stroke="#082334" stroke-width="6"/>
      <path d="M147 285h16v65h-16m207-65h16v65h-16" fill="none" stroke="#38545f" stroke-width="7"/>

      <!-- White body is a low-poly box with the SAME rear silhouette as the game. -->
      <path d="M161 224 194 173 320 173 353 224 370 312 361 366 157 366 148 316Z" fill="#ecf8f8" stroke="#0b3042" stroke-width="8"/>
      <path d="M161 224 194 173 194 297 158 324 148 316Z" fill="#aac8d2"/>
      <path d="M320 173 353 224 370 312 360 324 320 296Z" fill="#94b7c5"/>
      <path d="M194 175h126l18 40H176Z" fill="#fbffff"/>

      <!-- Broad tinted glass and glossy sweep are distinctive in-game features. -->
      <path d="M179 213 197 188h119l20 25 17 86-193 2Z" fill="url(#rearGlass)" stroke="#e7f9f8" stroke-width="8"/>
      <path d="m199 195 55 1-50 80-26 13Z" fill="#78b9c8" opacity=".72"/>
      <path d="M318 198 341 287 327 293 310 205Z" fill="#4d94a6" opacity=".5"/>
      <path d="M177 213 195 182h126l16 31" fill="none" stroke="#f8ffff" stroke-width="12"/>
      <path d="M163 296 355 296 368 323 358 355 157 355 151 323Z" fill="url(#whitePaint)"/>

      <!-- Graphite bumper, bright red taillights, and cyan license plate. -->
      <path d="M153 343h212v28H153Z" fill="#7c9da6"/>
      <path d="M148 363h223v16H148Z" fill="#253f4d"/>
      <path d="M160 324h45v26h-45Z" fill="#f26066"/>
      <path d="M314 324h45v26h-45Z" fill="#f26066"/>
      <path d="M164 326h38v6h-38m153-6h38v6h-38" fill="#ff9d99"/>
      <path d="M233 361h53v11h-53Z" fill="#b3e1db"/>
      <path d="M221 308h75" stroke="#f8ffff" stroke-width="5"/>
      <path d="M160 345h47m104 0h48" stroke="#ffffff" stroke-opacity=".24" stroke-width="2"/>
    </g>

    <path d="M66 145 160 46h42l-38 42h38l-95 91 15-49Z" fill="url(#gold)" stroke="#0b2e41" stroke-width="8" stroke-linejoin="round"/>
    <path d="M420 90h13m-6-6v13" stroke="#b1fff3" stroke-width="6"/>
    <path d="M450 139h8m-4-4v8" stroke="#fff0a0" stroke-width="5"/>
  </g>
  <rect x="8" y="8" width="496" height="496" rx="103" fill="none" stroke="#95fbdf" stroke-opacity=".27" stroke-width="8"/>
</svg>
